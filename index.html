<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Fishing Spot · Location Sharing Demo</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0a2e3f;
      background: #0b3d5a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #0b3d5a 0%, #1b7a8a 50%, #54c0c7 100%);
    }
    main {
      width: min(100%, 480px);
      padding: 34px;
      border: 2px solid rgba(255, 215, 150, .4);
      border-radius: 40px 40px 30px 30px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 20px 60px rgba(0, 20, 30, .5);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #1e5b6b;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.35rem); line-height: 1.08; }
    h1 span { color: #aa4700; }
    .logo { font-size: 64px; line-height: 1.2; margin-bottom: 12px; }
    .intro { margin: 14px 0 22px; color: #556176; line-height: 1.55; }
    .privacy {
      padding: 14px 16px;
      border: 2px dashed #d68b4a;
      border-radius: 24px;
      background: #fef9ef;
      color: #4a3728;
      font-size: .92rem;
      line-height: 1.45;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 60px;
      background: linear-gradient(135deg, #b95200, #a04000);
      box-shadow: 0 5px 0 #793000;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #963b00; }
    button:focus-visible { outline: 3px solid #70cbaa; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .7; }
    #result {
      min-height: 24px;
      margin-top: 20px;
      padding: 16px;
      border: 2px solid #1b7a8a;
      border-radius: 20px;
      background: #e6f4f7;
      line-height: 1.5;
    }
    #result[data-state="success"] { color: #176448; }
    #result[data-state="error"] { color: #a12c2c; }
    .coordinates { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .consent {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid #d5deea;
      border-radius: 20px;
      text-align: left;
      background: #f7f9fc;
      color: #3f4b60;
      font-size: .9rem;
      line-height: 1.45;
    }
    .consent.visible { display: block; }
    .consent label { display: flex; gap: 10px; align-items: flex-start; }
    .consent input { margin-top: 3px; }
    #submitLocation { display: none; background: #166675; box-shadow: 0 5px 0 #0b3d5a; }
    #submitLocation.visible { display: block; }
    #submitLocation:hover { background: #0b3d5a; }
    @media (max-width: 380px) {
      body { padding: 12px; }
      main { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🎣🐟</div>
    <p class="eyebrow">Location sharing · Educational demo</p>
    <h1>Your <span>Fishing Spot</span></h1>
    <p class="intro">Location is sent only with your consent.</p>

    <button id="requestLocation" type="button">Share my location for this test</button>
    <div id="result" role="status" aria-live="polite" hidden></div>

    <div class="consent" id="consentPanel">
      <label>
        <input id="consent" type="checkbox">
        <span>I consent to send my coordinates, accuracy, and submission time to the operator of this demonstration. The entry will be saved in a private server log file and in Render service logs. The file lasts until the container is replaced; Render’s logs follow its log-retention policy.</span>
      </label>
    </div>
    <button id="submitLocation" type="button" disabled>Send coordinates to operator</button>

  </main>

  <script>
    const button = document.querySelector('#requestLocation');
    const result = document.querySelector('#result');
    const consentPanel = document.querySelector('#consentPanel');
    const consent = document.querySelector('#consent');
    const submitButton = document.querySelector('#submitLocation');
    let capturedLocation = null;

    function finish(message, state) {
      result.hidden = false;
      result.innerHTML = message;
      result.dataset.state = state;
      button.disabled = false;
      button.textContent = 'Request location again';
    }

    button.addEventListener('click', () => {
      if (!navigator.geolocation) {
        finish('This browser does not support geolocation.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Waiting for your choice…';
      result.hidden = false;
      result.textContent = 'Your browser should now show its permission prompt.';
      result.dataset.state = '';

      navigator.geolocation.getCurrentPosition(
        ({ coords, timestamp }) => {
          capturedLocation = {
            latitude: Number(coords.latitude.toFixed(5)),
            longitude: Number(coords.longitude.toFixed(5)),
            accuracy: Math.round(coords.accuracy),
            capturedAt: new Date(timestamp).toISOString()
          };
          const latitude = coords.latitude.toFixed(5);
          const longitude = coords.longitude.toFixed(5);
          const accuracy = Math.round(coords.accuracy);
          finish(
            `Location shared with this page:<br><span class="coordinates">${latitude}, ${longitude}</span><br>` +
            `Approximate accuracy: ±${accuracy} m<br>Read at ${new Date(timestamp).toLocaleString()}.`,
            'success'
          );
          consentPanel.classList.add('visible');
          submitButton.classList.add('visible');
        },
        (error) => {
          const messages = {
            1: 'Location access was not granted. Nothing was collected.',
            2: 'Your device could not determine its location.',
            3: 'The location request timed out.'
          };
          finish(messages[error.code] || 'The location request could not be completed.', 'error');
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }
      );
    });

    consent.addEventListener('change', () => {
      submitButton.disabled = !consent.checked || !capturedLocation;
    });

    submitButton.addEventListener('click', async () => {
      if (!consent.checked || !capturedLocation) return;
      submitButton.disabled = true;
      submitButton.textContent = 'Sending…';

      try {
        const response = await fetch('/capture.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...capturedLocation, consent: true })
        });
        if (!response.ok) throw new Error('Submission failed');
        result.textContent = 'Coordinates were sent to the operator with your consent.';
        result.dataset.state = 'success';
        submitButton.textContent = 'Coordinates sent';
        consent.disabled = true;
      } catch {
        result.textContent = 'The coordinates could not be sent. Please try again.';
        result.dataset.state = 'error';
        submitButton.disabled = false;
        submitButton.textContent = 'Send coordinates to operator';
      }
    });
  </script>
</body>
</html>
